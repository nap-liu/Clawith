<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <script id="vconsole-bootstrap">
    (function () {
      try {
        if (new URLSearchParams(window.location.search).get('vconsole') === '1') {
          document.write('<script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"><\/script>');
        }
      } catch (_error) {
        // Diagnostics must never block normal application startup.
      }
    }());
  </script>
  <script id="vconsole-init">
    (function () {
      try {
        if (
          new URLSearchParams(window.location.search).get('vconsole') === '1'
          && typeof window.VConsole === 'function'
          && !window.__clawithVConsole
        ) {
          window.__clawithVConsole = new window.VConsole();
        }
      } catch (_error) {
        // Diagnostics must never block normal application startup.
      }
    }());
  </script>
  <script id="h5-platform-sdk-bootstrap">
    (function () {
      if (window.location.pathname.indexOf('/h5/') !== 0) return;

      var userAgent = String(navigator.userAgent || '');
      var lowerUserAgent = userAgent.toLowerCase();
      if (lowerUserAgent.indexOf('dingtalk') > -1 || userAgent.indexOf('AliApp') > -1) {
        document.writeln('<script src="https://appx/web-view.min.js"' + '>' + '<' + '/' + 'script>');
      }
      if (lowerUserAgent.indexOf('micromessenger') > -1) {
        document.writeln('<script src="https://res.wx.qq.com/open/js/jweixin-1.3.2.js"' + '>' + '<' + '/' + 'script>');
      }
    }());
  </script>
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="企业数字员工平台" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f8f8f7" />
  <script id="theme-bootstrap">
    (function () {
      var root = document.documentElement;
      var isH5 = window.location.pathname.indexOf('/h5/') === 0;
      var mode = 'light';
      var resolved = 'light';

      if (isH5) {
        try {
          var value = new URLSearchParams(window.location.search).get('theme');
          value = typeof value === 'string' ? value.trim().toLowerCase() : '';
          mode = value === 'light' || value === 'dark' ? value : 'system';
        } catch (_error) {
          mode = 'system';
        }

        if (mode === 'light' || mode === 'dark') {
          resolved = mode;
        } else {
          try {
            resolved = window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          } catch (_error) {
            resolved = 'light';
          }
        }
      } else {
        try {
          resolved = window.localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (_error) {
          resolved = 'light';
        }
        mode = resolved;
      }

      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-mode', mode);
      root.style.colorScheme = resolved;
      var themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.setAttribute('content', resolved === 'dark' ? '#0a0a0f' : '#f8f8f7');
    }());
  </script>
  <title>数字员工平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
